[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mip"
version = "1.0.0"
description = "motor-insurance-pricing"
requires-python = "==3.12.*"
dependencies = [
    "scikit-learn",
    "ipykernel",
    "pyarrow",
    "pandas",
    "matplotlib",
    "seaborn",
    "statsmodels",

    
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]